<!DOCTYPE html>
<html>
<head>
  <title>Salvage</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#060409] min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full text-center space-y-8">
    <div class="w-28 h-28 mx-auto bg-gradient-to-br from-violet-600 to-cyan-600 rounded-3xl flex items-center justify-center">
      <svg width="60" height="60" viewBox="0 0 100 100">
        <path d="M 50 10 L 85 30 L 85 70 L 50 90 L 15 70 L 15 30 Z" fill="white" opacity="0.9"/>

    </div>
    
    <div>

        SALVAGE

      <p class="text-gray-500 text-xs">Ghana's #1 Auto Diagnostics & Import Platform</p>
    </div>

    <div class="space-y-3">
      <button class="w-full h-14 bg-gradient-to-r from-violet-700 to-indigo-700 text-white rounded-2xl font-medium shadow-lg">
        Continue with Phone Number
      </button>
      <button class="w-full h-14 bg-gradient-to-r from-cyan-500 to-blue-500 text-white rounded-2xl font-medium shadow-lg">
        Continue with Email
      </button>
      <p class="text-xs text-gray-500 pt-2">Mobile money payments supported</p>
    </div>
  </div>
